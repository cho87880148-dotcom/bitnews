# =========================================================
#  비트뉴스 — 뉴스 자동 수집 및 배포
#
#  이 파일은 GitHub 서버가 읽는 설명서입니다.
#  내 PC 가 꺼져 있어도 GitHub 이 알아서 1시간마다 뉴스를 모아
#  사이트를 다시 만들고 배포합니다.
#
#  수동으로 즉시 돌리고 싶으면:
#    GitHub 저장소 → Actions 탭 → 이 작업 선택 → Run workflow
# =========================================================

name: 뉴스 자동 수집

on:
  schedule:
    # 매시 정각에 실행합니다. 시간은 UTC 기준이라 한국시간과 9시간 차이가 나지만,
    # 매시간 도는 것이라 실제로는 신경 쓸 필요가 없습니다.
    - cron: '0 * * * *'
  # Actions 탭에서 손으로 눌러 실행할 수 있게 합니다
  workflow_dispatch:
  # 코드를 고쳐 올렸을 때도 즉시 반영합니다
  push:
    branches: [main]

# 아래 권한이 있어야 수집 결과를 저장소에 되돌려 저장하고 사이트를 배포할 수 있습니다
permissions:
  contents: write
  pages: write
  id-token: write

# 여러 개가 동시에 돌아 서로 덮어쓰는 것을 막습니다
concurrency:
  group: bitnews-pages
  cancel-in-progress: false

jobs:
  build:
    name: 수집 및 생성
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 뉴스 수집 및 HTML 생성
        shell: pwsh
        run: ./build.ps1

      - name: 모아둔 기사 목록 저장
        # 예전 기사가 사라지지 않도록 data/articles.json 을 저장소에 되돌려 넣습니다.
        # 새 기사가 없으면 커밋할 것이 없으므로 그냥 넘어갑니다.
        run: |
          git config user.name  "bitnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --staged --quiet; then
            echo "새 기사가 없어 저장할 내용이 없습니다."
          else
            git commit -m "뉴스 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Pages 설정 읽기
        uses: actions/configure-pages@v5

      - name: 생성된 사이트 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v4
