# =========================================================
#  비트뉴스 — 주간 정리 초고 자동 생성 (검토 후 발행)
#
#  월요일 아침, Claude Code 가 지난 한 주 기사를 "조사한 뒤" 글을 씁니다.
#  API 를 한 번 부르고 마는 게 아니라, 기사를 검색하고 숫자를 대조하면서
#  씁니다. 사람이 1주차 글을 쓸 때 했던 방식과 같습니다.
#
#  ★ 이 작업은 사이트에 아무것도 올리지 않습니다.
#    사람이 Pull requests 탭에서 읽어보고 [Merge] 를 눌러야 발행됩니다.
#
#  손으로 지금 돌려보고 싶으면:
#    Actions 탭 → "주간 정리 초고" → Run workflow
#
#  그만두고 싶으면:
#    Actions 탭 → 왼쪽에서 "주간 정리 초고" → 오른쪽 "..." → Disable workflow
#
#  글 쓰는 규칙은 .github/weekly-instructions.md 에 있습니다. 거기를 고치세요.
#  검토 요청 안내문은 .github/weekly-pr-body.md 에 있습니다.
# =========================================================

name: 주간 정리 초고

on:
  schedule:
    # 한국시간 월요일 오전 7시 = UTC 일요일 22시
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: '며칠치를 정리할지 (기본 7)'
        required: false
        default: '7'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-draft
  cancel-in-progress: false

jobs:
  draft:
    name: 초고 생성 및 검토 요청
    runs-on: ubuntu-latest
    # 조사하며 쓰느라 오래 걸립니다. 그래도 30분을 넘기면 뭔가 잘못된 것이니 끊습니다.
    timeout-minutes: 30
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 주차 이름 정하고 중복 확인
        id: meta
        shell: pwsh
        run: |
          $days = [int]'${{ github.event.inputs.days || '7' }}'
          $kst = (Get-Date).ToUniversalTime().AddHours(9)
          $weekNo = [math]::Ceiling($kst.Day / 7.0)
          $slug = '{0:yyyy-MM}-w{1}' -f $kst, $weekNo
          $from = $kst.AddDays(-$days)
          $exists = Test-Path "weekly/posts/$slug.html"
          Write-Host "주차 $slug / 기간 $($from.ToString('yyyy-MM-dd')) ~ $($kst.ToString('yyyy-MM-dd')) / 이미 있음 $exists"
          "slug=$slug"                                  | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "branch=weekly/$slug"                         | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "from=$($from.ToString('yyyy-MM-dd'))"        | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "to=$($kst.ToString('yyyy-MM-dd'))"           | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "days=$days"                                  | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "skip=$($exists.ToString().ToLower())"        | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 글감 준비 (이번 주 기사 추리기)
        if: steps.meta.outputs.skip == 'false'
        shell: pwsh
        run: ./prepare-weekly-context.ps1 -Days ${{ steps.meta.outputs.days }}

      - name: Claude Code 로 조사하고 글쓰기
        if: steps.meta.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            .github/weekly-instructions.md 를 읽고 그대로 따라 주간 정리 기사를 작성하십시오.

            이번 주차 정보:
            - slug: ${{ steps.meta.outputs.slug }}
            - 기간: ${{ steps.meta.outputs.from }} ~ ${{ steps.meta.outputs.to }} (한국시간)

            만들 파일:
            - weekly/posts/${{ steps.meta.outputs.slug }}.html
            - weekly/.work/meta.json

            지시서에 적힌 대로, 글을 쓰기 전에 반드시 기사를 조사하고
            모든 수치를 weekly/.work/full.md 에서 확인하십시오.
          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Write,Bash"

      - name: 목차에 등록하고 결과 확인
        if: steps.meta.outputs.skip == 'false'
        shell: pwsh
        run: |
          ./apply-weekly-meta.ps1 -Slug '${{ steps.meta.outputs.slug }}' -From '${{ steps.meta.outputs.from }}' -To '${{ steps.meta.outputs.to }}'

      - name: 제목 읽기
        id: post
        if: steps.meta.outputs.skip == 'false'
        shell: pwsh
        run: |
          $cfg = (Get-Content 'weekly/weekly.json' -Raw -Encoding UTF8) | ConvertFrom-Json
          $title = $cfg.posts[0].title
          if ([string]::IsNullOrWhiteSpace($title)) { throw '새 글 제목을 읽지 못했습니다.' }
          Write-Host "제목: $title"
          "title=$title" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 사이트가 정상적으로 만들어지는지 확인
        if: steps.meta.outputs.skip == 'false'
        shell: pwsh
        run: |
          # 글을 넣고 빌드가 깨지지 않는지 미리 확인합니다.
          # 여기서 실패하면 검토 요청을 올리지 않습니다.
          ./build.ps1

      - name: 검토 요청(Pull Request) 올리기
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.meta.outputs.slug }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          TITLE: ${{ steps.post.outputs.title }}
        run: |
          git config user.name  "bitnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # weekly/.work 와 dist 는 .gitignore 로 빠지므로 원고와 목차만 올라갑니다
          git add weekly/
          git commit -m "주간 정리 초고: $SLUG"
          git push origin "$BRANCH"
          gh pr create \
            --title "주간 정리 검토: $TITLE" \
            --body-file .github/weekly-pr-body.md \
            --base main \
            --head "$BRANCH"

      - name: 건너뛴 경우 안내
        if: steps.meta.outputs.skip == 'true'
        run: echo "이번 주 글이 이미 있어서 새로 만들지 않았습니다."
