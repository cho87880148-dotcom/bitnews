# =========================================================
#  비트뉴스 — 주간 정리 초고 자동 생성 (검토 후 발행)
#
#  월요일 아침에 지난 한 주 기사를 정리한 글을 만들어
#  "검토 요청(Pull Request)"으로 올려둡니다.
#
#  ★ 이 작업은 사이트에 아무것도 올리지 않습니다.
#    사람이 Pull requests 탭에서 읽어보고 [Merge] 를 눌러야 발행됩니다.
#
#  손으로 지금 돌려보고 싶으면:
#    Actions 탭 → "주간 정리 초고" → Run workflow
#
#  그만두고 싶으면:
#    Actions 탭 → 왼쪽에서 "주간 정리 초고" → 오른쪽 "..." → Disable workflow
#
#  검토 요청에 뜨는 안내문은 .github/weekly-pr-body.md 에 있습니다.
# =========================================================

name: 주간 정리 초고

on:
  schedule:
    # 한국시간 월요일 오전 7시 = UTC 일요일 22시
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: '며칠치를 정리할지 (기본 7)'
        required: false
        default: '7'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-draft
  cancel-in-progress: false

jobs:
  draft:
    name: 초고 생성 및 검토 요청
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 주차 이름 정하고 중복 확인
        id: meta
        shell: pwsh
        run: |
          $kst = (Get-Date).ToUniversalTime().AddHours(9)
          $weekNo = [math]::Ceiling($kst.Day / 7.0)
          $slug = '{0:yyyy-MM}-w{1}' -f $kst, $weekNo
          $exists = Test-Path "weekly/posts/$slug.html"
          Write-Host "주차 이름: $slug   이미 있음: $exists"
          "slug=$slug"            | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "branch=weekly/$slug"   | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "skip=$($exists.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 초고 생성 (Claude API)
        if: steps.meta.outputs.skip == 'false'
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ./generate-weekly.ps1 -Days ${{ github.event.inputs.days || '7' }} -Slug '${{ steps.meta.outputs.slug }}'

      - name: 생성된 제목 읽기
        id: post
        if: steps.meta.outputs.skip == 'false'
        shell: pwsh
        run: |
          $cfg = (Get-Content 'weekly/weekly.json' -Raw -Encoding UTF8) | ConvertFrom-Json
          $title = $cfg.posts[0].title
          if ([string]::IsNullOrWhiteSpace($title)) { throw '새 글 제목을 읽지 못했습니다.' }
          Write-Host "제목: $title"
          "title=$title" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 사이트가 정상적으로 만들어지는지 확인
        if: steps.meta.outputs.skip == 'false'
        shell: pwsh
        run: |
          # 글을 넣고 빌드가 깨지지 않는지 미리 확인합니다.
          # 여기서 실패하면 검토 요청을 올리지 않습니다.
          ./build.ps1

      - name: 검토 요청(Pull Request) 올리기
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.meta.outputs.slug }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          TITLE: ${{ steps.post.outputs.title }}
        run: |
          git config user.name  "bitnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # dist 는 .gitignore 로 빠지므로 원고와 목차만 올라갑니다
          git add weekly/
          git commit -m "주간 정리 초고: $SLUG"
          git push origin "$BRANCH"
          gh pr create \
            --title "주간 정리 검토: $TITLE" \
            --body-file .github/weekly-pr-body.md \
            --base main \
            --head "$BRANCH"

      - name: 건너뛴 경우 안내
        if: steps.meta.outputs.skip == 'true'
        run: echo "이번 주 글이 이미 있어서 새로 만들지 않았습니다."
